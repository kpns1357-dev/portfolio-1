name: CivicOS CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      JWT_SECRET: civicos_test_environment_jwt_secret_with_minimum_32_characters_key!
      JWT_REFRESH_SECRET: civicos_test_environment_jwt_refresh_secret_with_32_characters_key!
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push Prisma SQLite schema
        run: npx prisma db push

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run test suite with coverage
        run: npm test

      - name: Build Next.js application
        run: npm run build
